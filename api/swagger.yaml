openapi: 3.0.3
info:
  title: API REST ShowMe
  version: 1.0.0
  description: >-
    API em PHP puro para usuários, sessões, eventos, favoritos, planejamentos e comunidades.
    Campos DATE usam YYYY-MM-DD; campos DATETIME usam ISO 8601/RFC 3339 com o fuso
    America/Sao_Paulo, por exemplo 2026-09-21T14:30:00-03:00.

servers:
  - url: ./
    description: API na mesma origem do front-end

tags:
  - name: Sessões
  - name: Usuários
  - name: Eventos
  - name: Favoritos
  - name: Planejamentos
  - name: Google Agenda
  - name: Comunidades

paths:
  /sessoes:
    get:
      tags: [Sessões]
      summary: Retorna o usuário da sessão atual
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Sessão ativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    post:
      tags: [Sessões]
      summary: Cria uma sessão com senha ou ID token do Google
      description: >-
        No login Google, procura primeiro pelo sub em google_id; se não encontrar,
        vincula uma conta do mesmo e-mail ou cria um usuário comum sem senha.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginEntrada'
      responses:
        '201':
          description: Login realizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '409':
          description: E-mail já vinculado a outra identidade Google
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '503':
          description: Login Google ainda não configurado ou dependências ausentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      tags: [Sessões]
      summary: Encerra a sessão atual
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Logout realizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /usuarios:
    post:
      tags: [Usuários]
      summary: Cadastra um usuário comum
      description: Qualquer tipo_usuario enviado pelo cliente é ignorado; o valor persistido é sempre comum.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCadastro'
      responses:
        '201':
          description: Usuário cadastrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '409':
          description: E-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /usuarios/{id}:
    get:
      tags: [Usuários]
      summary: Consulta um perfil
      description: Permitido para o próprio usuário ou para um administrador.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      responses:
        '200':
          description: Perfil encontrado, incluindo as contagens reais de atividades do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: '#/components/schemas/Usuario'
                  estatisticas:
                    $ref: '#/components/schemas/EstatisticasPerfil'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    post:
      tags: [Usuários]
      summary: Personaliza a foto e o banner do próprio perfil
      description: >-
        Recebe upload recortado ou o caminho de uma fotografia pronta da lista branca.
        Para cada tipo, envie o arquivo ou o campo *_pronta, nunca os dois. O servidor
        valida o MIME real e redimensiona uploads para 500x500 ou 1600x400.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [acao]
              properties:
                acao:
                  type: string
                  enum: [personalizar_midia]
                foto_perfil:
                  type: string
                  format: binary
                  description: JPG, PNG ou WebP; saída final em 500x500.
                foto_banner:
                  type: string
                  format: binary
                  description: JPG, PNG ou WebP; saída final em 1600x400.
                foto_perfil_pronta:
                  type: string
                  description: Caminho de uma fotografia de perfil presente no catálogo oficial.
                foto_banner_pronta:
                  type: string
                  description: Caminho de uma fotografia de banner presente no catálogo oficial.
      responses:
        '200':
          description: Personalização atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    put:
      tags: [Usuários]
      summary: Atualiza o próprio perfil
      description: Permite alterar nome, sobrenome, e-mail e senha. tipo_usuario nunca é editável pela API.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioAtualizacao'
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: E-mail já utilizado por outro usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      tags: [Usuários]
      summary: Apaga a própria conta
      description: A exclusão em cascata do banco remove favoritos, avaliações, preferências, rotas, dados do Spotify e solicitações do usuário.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      responses:
        '200':
          description: Conta removida e sessão encerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /eventos:
    get:
      tags: [Eventos]
      summary: Lista eventos públicos ou solicitações para moderação
      description: Sem parâmetros, lista somente eventos ativos com data igual ou posterior a hoje. Com busca, aplica o mesmo recorte de data e filtra por nome, cidade, categoria ou artista. Com solicitacoes, consulta a tabela de solicitações e exige uma sessão de administrador; nessa modalidade, busca, dias, limite e offset controlam a listagem administrativa paginada.
      parameters:
        - name: busca
          in: query
          required: false
          description: Termo pesquisado no nome do evento, cidade, categoria ou artista.
          schema:
            type: string
          example: Festival
        - name: limite
          in: query
          required: false
          description: Quantidade máxima de resultados. Usado pelo autocomplete público e pela paginação da listagem administrativa de solicitações.
          schema:
            type: integer
            minimum: 1
            maximum: 50
          example: 5
        - name: solicitacoes
          in: query
          required: false
          description: Lista solicitações do status escolhido. Removido representa uma solicitação aprovada cujo evento publicado já foi excluído. Esta modalidade é restrita a administradores.
          schema:
            type: string
            enum: [pendente, aprovado, recusado, removido, todas]
          example: pendente
        - name: dias
          in: query
          required: false
          description: Na listagem de solicitações, considera apenas registros criados nos últimos N dias. Zero inclui todo o período.
          schema: {type: integer, minimum: 0, maximum: 3650, default: 0}
        - name: offset
          in: query
          required: false
          description: Deslocamento da paginação administrativa; exige limite.
          schema: {type: integer, minimum: 0, default: 0}
        - name: incluir_cancelados
          in: query
          required: false
          description: Use 1 para incluir eventos cancelados. Restrito a administradores.
          schema:
            type: integer
            enum: [0, 1]
            default: 0
      responses:
        '200':
          description: Lista de eventos públicos ou de solicitações administrativas
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      eventos:
                        type: array
                        items:
                          $ref: '#/components/schemas/Evento'
                  - type: object
                    properties:
                      solicitacoes:
                        type: array
                        items:
                          $ref: '#/components/schemas/SolicitacaoAdmin'
                      contadores:
                        type: object
                        properties:
                          todas: {type: integer}
                          pendente: {type: integer}
                          aprovado: {type: integer}
                          recusado: {type: integer}
                          removido: {type: integer}
                      total: {type: integer}
                      limite: {type: integer, nullable: true}
                      offset: {type: integer}
                      tem_mais: {type: boolean}
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
    post:
      tags: [Eventos]
      summary: Cria uma solicitação de evento
      description: O evento permanece pendente até a análise de um administrador. Exige exatamente uma foto JPG, PNG ou WebP, com até 10 MB; vídeos não são aceitos. Os dados textuais da solicitação pendente podem ser corrigidos por um administrador com PUT e acao=editar_solicitacao; a foto original é preservada.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SolicitacaoCadastro'
      responses:
        '201':
          description: Solicitação criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  solicitacao:
                    $ref: '#/components/schemas/SolicitacaoResultado'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /eventos/{id}:
    get:
      tags: [Eventos]
      summary: Consulta um evento aprovado
      description: Eventos passados continuam acessíveis por ID. Por padrão, eventos cancelados retornam 404; um administrador pode consultá-los com incluir_cancelados=1.
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
        - name: incluir_cancelados
          in: query
          required: false
          description: Use 1 para permitir o retorno de um evento cancelado. Restrito a administradores.
          schema:
            type: integer
            enum: [0, 1]
            default: 0
      responses:
        '200':
          description: Evento encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  evento:
                    $ref: '#/components/schemas/EventoDetalhe'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
    put:
      tags: [Eventos]
      summary: Edita/modera uma solicitação ou edita um evento publicado
      description: >-
        Use acao=editar_solicitacao para corrigir uma solicitação ainda pendente,
        acao=aprovar ou acao=recusar para decidir diretamente, acao=moderar com
        status_solicitacao para manter compatibilidade, e acao=editar quando o ID
        representar um evento já publicado. Ao aprovar, todos os campos são
        promovidos para evento, id_solicitacao_origem é preenchido e o artista é
        criado ou reutilizado por nome normalizado. Aprovação e recusa tentam enviar
        um e-mail transacional ao solicitante; falhas de SMTP são registradas no
        servidor sem desfazer a moderação. A edição preserva a foto enviada e
        também tenta notificar por e-mail o usuário que cadastrou o evento.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ModeracaoSolicitacao'
                - $ref: '#/components/schemas/EdicaoSolicitacao'
                - $ref: '#/components/schemas/EventoAtualizacao'
      responses:
        '200':
          description: Solicitação analisada ou evento atualizado
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      mensagem:
                        type: string
                      solicitacao:
                        $ref: '#/components/schemas/SolicitacaoResultado'
                  - type: object
                    properties:
                      mensagem:
                        type: string
                      solicitacao:
                        $ref: '#/components/schemas/SolicitacaoAdmin'
                  - type: object
                    properties:
                      mensagem:
                        type: string
                      evento:
                        $ref: '#/components/schemas/Evento'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Solicitação já analisada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      tags: [Eventos]
      summary: Remove um evento
      description: Restrito a administradores. Relacionamentos configurados com ON DELETE CASCADE são removidos pelo banco e o usuário que cadastrou o evento é notificado por e-mail. Falha no SMTP não desfaz a remoção.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      responses:
        '200':
          description: Evento removido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /planejamento:
    get:
      tags: [Planejamentos]
      summary: Lista os planejamentos finalizados do usuário atual
      description: Cada planejamento já inclui os dados principais do evento relacionado, em ordem da data mais recente para a mais antiga.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Lista de planejamentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  planejamentos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Planejamento'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    post:
      tags: [Planejamentos]
      summary: Finaliza o planejamento de um evento
      description: Um usuário pode manter somente um planejamento por evento. Eventos encerrados ou indisponíveis não aceitam novos planejamentos.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanejamentoCadastro'
      responses:
        '201':
          description: Planejamento criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  planejamento:
                    $ref: '#/components/schemas/PlanejamentoRota'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: O usuário já finalizou um planejamento para o evento, ou o evento está encerrado/indisponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /planejamento/{id}:
    put:
      tags: [Planejamentos]
      summary: Edita um planejamento do usuário atual
      description: O parâmetro id representa id_rota. id_user e id_evento não são editáveis. Planejamentos de eventos encerrados permanecem visíveis, mas não podem ser alterados.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanejamentoAtualizacao'
      responses:
        '200':
          description: Planejamento atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  planejamento:
                    $ref: '#/components/schemas/PlanejamentoRota'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: O evento já foi encerrado ou está indisponível para alteração
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    delete:
      tags: [Planejamentos]
      summary: Desfaz um planejamento do usuário atual
      description: O parâmetro id representa id_rota.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      responses:
        '200':
          description: Planejamento removido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /google-calendar:
    get:
      tags: [Google Agenda]
      summary: Consulta o estado da conexão do usuário com o Google Agenda
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Estado atual da integração
          content:
            application/json:
              schema:
                type: object
                properties:
                  configurado:
                    type: boolean
                  conectado:
                    type: boolean
                  data_conexao:
                    type: string
                    format: date-time
                    nullable: true
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    post:
      tags: [Google Agenda]
      summary: Verifica conflito ou exporta um planejamento
      description: >-
        verificar_conflito consulta a agenda somente nesta requisição. exportar cria
        um evento único, com ID determinístico, sem sincronização posterior.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/GoogleAgendaConflitoEntrada'
                - $ref: '#/components/schemas/GoogleAgendaExportacaoEntrada'
      responses:
        '200':
          description: Resultado da checagem ou evento já exportado anteriormente
        '201':
          description: Evento criado no Google Agenda
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Google Agenda ainda não conectado para exportação
        '502':
          description: Falha de comunicação com o Google Agenda
        '503':
          description: Integração ainda não configurada no servidor
    delete:
      tags: [Google Agenda]
      summary: Desconecta a agenda do usuário atual
      description: Tenta revogar o token no Google e remove o token armazenado localmente.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Integração desconectada
        '401':
          $ref: '#/components/responses/NaoAutenticado'
  /favoritos:
    get:
      tags: [Favoritos]
      summary: Lista os favoritos do usuário atual
      description: Cada item contém id_favorito e id_evento, permitindo ao frontend alternar o favorito sem endpoint adicional. A lista vem ordenada pela data do evento, da mais recente para a mais antiga.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Lista de favoritos
          content:
            application/json:
              schema:
                type: object
                properties:
                  favoritos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Favorito'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    post:
      tags: [Favoritos]
      summary: Adiciona um evento aos favoritos
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_evento]
              properties:
                id_evento:
                  type: integer
      responses:
        '201':
          description: Favorito criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  favorito:
                    $ref: '#/components/schemas/FavoritoCriado'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Evento já favoritado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /favoritos/{id}:
    delete:
      tags: [Favoritos]
      summary: Remove um favorito
      description: O parâmetro id representa id_favorito e o registro deve pertencer ao usuário atual.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      responses:
        '200':
          description: Favorito removido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /comunidade-posts:
    get:
      tags: [Comunidades]
      summary: Lista publicações de um evento ou o resumo das comunidades
      security: [{cookieAuth: []}]
      parameters:
        - {name: evento_id, in: query, schema: {type: integer, minimum: 1}}
        - {name: categoria, in: query, schema: {type: string, enum: [Duvida, Dica, Transporte, Hospedagem, Companhia, Relato]}}
        - {name: resumo, in: query, schema: {type: integer, enum: [1]}}
      responses:
        '200': {description: Publicações ou comunidades retornadas}
        '400': {$ref: '#/components/responses/RequisicaoInvalida'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
    post:
      tags: [Comunidades]
      summary: Cria uma publicação
      description: Restrito a usuários comuns; administradores possuem acesso somente para leitura.
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComunidadePostEntrada'}
      responses:
        '201': {description: Publicação criada}
        '400': {$ref: '#/components/responses/RequisicaoInvalida'}
        '401': {$ref: '#/components/responses/NaoAutenticado'}
        '403': {$ref: '#/components/responses/Proibido'}
  /comunidade-posts/{id}:
    put:
      tags: [Comunidades]
      summary: Edita categoria e texto de uma publicação do próprio autor
      description: Restrito a usuários comuns; administradores possuem acesso somente para leitura.
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdNaRota'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComunidadePostEdicao'}
      responses:
        '200': {description: Publicação atualizada}
        '400': {$ref: '#/components/responses/RequisicaoInvalida'}
        '403': {$ref: '#/components/responses/Proibido'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
    delete:
      tags: [Comunidades]
      summary: Exclui uma publicação do próprio autor
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdNaRota'}]
      responses:
        '200': {description: Publicação excluída}
        '403': {$ref: '#/components/responses/Proibido'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
  /comunidade-respostas:
    post:
      tags: [Comunidades]
      summary: Responde a uma publicação (um nível)
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComunidadeRespostaEntrada'}
      responses:
        '201': {description: Resposta criada}
        '400': {$ref: '#/components/responses/RequisicaoInvalida'}
        '403': {$ref: '#/components/responses/Proibido'}
  /comunidade-respostas/{id}:
    put:
      tags: [Comunidades]
      summary: Edita uma resposta do próprio autor
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdNaRota'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComunidadeRespostaEdicao'}
      responses:
        '200': {description: Resposta atualizada}
        '400': {$ref: '#/components/responses/RequisicaoInvalida'}
        '403': {$ref: '#/components/responses/Proibido'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
    delete:
      tags: [Comunidades]
      summary: Exclui uma resposta do próprio autor
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdNaRota'}]
      responses:
        '200': {description: Resposta excluída}
        '403': {$ref: '#/components/responses/Proibido'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
  /comunidade-curtidas:
    post:
      tags: [Comunidades]
      summary: Alterna a curtida do usuário em uma publicação
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_post]
              properties: {id_post: {type: integer, minimum: 1}}
      responses:
        '200': {description: Estado e total de curtidas atualizados}
        '403': {$ref: '#/components/responses/Proibido'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
  /comunidade-denuncias:
    get:
      tags: [Comunidades, Administração]
      summary: Lista denúncias de publicações e fotos para moderação
      description: Restrito a administradores. Retorna o conteúdo, autor, denunciante, comunidade, motivo e situação da denúncia.
      security: [{cookieAuth: []}]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [todas, pendente, mantido, removido]
            default: todas
        - name: busca
          in: query
          required: false
          description: Pesquisa no conteúdo, motivo, autor, denunciante e comunidade.
          schema: {type: string, maxLength: 100}
        - name: dias
          in: query
          required: false
          description: Considera apenas denúncias criadas nos últimos N dias. Zero inclui todo o período.
          schema: {type: integer, minimum: 0, maximum: 3650, default: 0}
        - name: limite
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50}
        - name: offset
          in: query
          required: false
          description: Deslocamento da paginação; exige limite.
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Denúncias retornadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  denuncias:
                    type: array
                    items: {$ref: '#/components/schemas/ComunidadeDenuncia'}
                  contadores:
                    type: object
                    properties:
                      todas: {type: integer}
                      pendente: {type: integer}
                      mantido: {type: integer}
                      removido: {type: integer}
                  total: {type: integer}
                  limite: {type: integer, nullable: true}
                  offset: {type: integer}
                  tem_mais: {type: boolean}
        '403': {$ref: '#/components/responses/Proibido'}
    post:
      tags: [Comunidades]
      summary: Denuncia uma publicação ou foto
      description: Exatamente um entre id_post e id_midia deve ser informado.
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComunidadeDenunciaEntrada'}
      responses:
        '201': {description: Denúncia persistida}
        '400': {$ref: '#/components/responses/RequisicaoInvalida'}
        '403': {$ref: '#/components/responses/Proibido'}
        '409': {description: O usuário já denunciou o mesmo conteúdo}
  /comunidade-denuncias/{id}:
    put:
      tags: [Comunidades, Administração]
      summary: Mantém ou remove uma publicação ou foto denunciada
      description: >-
        Restrito a administradores. A decisão vale para todas as denúncias pendentes do
        mesmo conteúdo. A API envia e-mail aos denunciantes e, em caso de remoção, ao
        autor. Posts usam exclusão lógica; fotos também têm o arquivo físico removido.
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdNaRota'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModeracaoDenunciaEntrada'}
      responses:
        '200': {description: Denúncia analisada}
        '400': {$ref: '#/components/responses/RequisicaoInvalida'}
        '403': {$ref: '#/components/responses/Proibido'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}
        '409': {description: Denúncia já analisada}
  /comunidade-midias:
    get:
      tags: [Comunidades]
      summary: Lista fotos da galeria de um evento
      security: [{cookieAuth: []}]
      parameters:
        - {name: evento_id, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Galeria retornada}
    post:
      tags: [Comunidades]
      summary: Publica uma foto na galeria
      description: Restrito a usuários comuns; administradores possuem acesso somente para leitura.
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/ComunidadeMidiaEntrada'}
      responses:
        '201': {description: Foto publicada}
        '400': {$ref: '#/components/responses/RequisicaoInvalida'}
        '403': {$ref: '#/components/responses/Proibido'}
  /comunidade-midias/{id}:
    delete:
      tags: [Comunidades]
      summary: Exclui a foto e o arquivo físico do próprio autor
      security: [{cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdNaRota'}]
      responses:
        '200': {description: Foto excluída}
        '403': {$ref: '#/components/responses/Proibido'}
        '404': {$ref: '#/components/responses/NaoEncontrado'}

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: PHPSESSID

  parameters:
    IdNaRota:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    RequisicaoInvalida:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoAutenticado:
      description: Sessão inexistente ou credenciais inválidas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Proibido:
      description: Usuário sem permissão
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoEncontrado:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

  schemas:
    Erro:
      type: object
      required: [erro]
      properties:
        erro:
          type: string

    Mensagem:
      type: object
      required: [mensagem]
      properties:
        mensagem:
          type: string

    LoginEntrada:
      description: Use exatamente uma das duas formas de autenticação.
      oneOf:
        - $ref: '#/components/schemas/LoginSenhaEntrada'
        - $ref: '#/components/schemas/LoginGoogleEntrada'

    LoginSenhaEntrada:
      type: object
      required: [email, senha]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 100
        senha:
          type: string
          format: password

    LoginGoogleEntrada:
      type: object
      required: [google_token]
      additionalProperties: false
      properties:
        google_token:
          type: string
          description: ID token JWT emitido pelo Google Identity Services.

    UsuarioCadastro:
      type: object
      required: [nome, sobrenome, email, senha]
      properties:
        nome:
          type: string
          maxLength: 100
        sobrenome:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        senha:
          type: string
          format: password
          minLength: 6

    UsuarioAtualizacao:
      type: object
      description: Informe pelo menos um campo editável. Se tipo_usuario for enviado, será ignorado e nunca alterado.
      properties:
        nome:
          type: string
          maxLength: 100
        sobrenome:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        senha:
          type: string
          format: password
          minLength: 6

    Usuario:
      type: object
      properties:
        id_user:
          type: integer
        nome_user:
          type: string
        sobrenome:
          type: string
          nullable: true
        email_user:
          type: string
          format: email
        tipo_usuario:
          type: string
          enum: [comum, admin]
        foto_perfil:
          type: string
          nullable: true
          readOnly: true
          description: Caminho do upload processado ou do SVG pronto selecionado.
        foto_banner:
          type: string
          nullable: true
          readOnly: true
          description: Caminho do upload processado ou do SVG pronto selecionado.
        data_cadastro:
          type: string
          format: date-time

    EstatisticasPerfil:
      type: object
      readOnly: true
      required: [publicacoes_comunidade, viagens_planejadas, eventos_cadastrados]
      properties:
        publicacoes_comunidade:
          type: integer
          minimum: 0
          description: Total de publicações de texto e fotos enviadas pelo usuário nas comunidades; respostas não entram na contagem.
        viagens_planejadas:
          type: integer
          minimum: 0
          description: Total histórico de planejamentos finalizados pelo usuário, inclusive de eventos já encerrados.
        eventos_cadastrados:
          type: integer
          minimum: 0
          description: Eventos efetivamente publicados a partir de solicitações cadastradas pelo usuário.

    Evento:
      type: object
      properties:
        id_evento:
          type: integer
        id_solicitacao_origem:
          type: integer
          nullable: true
          readOnly: true
        num_evento:
          type: integer
          nullable: true
          readOnly: true
          description: Campo legado, mantido no banco e sem uso definido pela API.
        nome_evento:
          type: string
        cep_evento:
          type: string
          pattern: '^\d{8}$'
          nullable: true
        endereco_evento:
          type: string
          maxLength: 255
          nullable: true
        numero_endereco:
          type: string
          maxLength: 20
          nullable: true
        rua_evento:
          type: string
          maxLength: 100
          nullable: true
        cidade_evento:
          type: string
          maxLength: 100
          nullable: true
        uf:
          type: string
          nullable: true
        descricao_evento:
          type: string
          nullable: true
        data_evento:
          type: string
          format: date
          nullable: true
        horario_evento:
          type: string
          format: time
          nullable: true
        gratuidade:
          type: boolean
        valor_ingresso_minimo:
          type: number
          format: double
          nullable: true
        valor_ingresso_maximo:
          type: number
          format: double
          nullable: true
        categoria_evento:
          type: string
          maxLength: 255
          nullable: true
        link_oficial:
          type: string
          format: uri
          maxLength: 255
          nullable: true
        imagem_evento:
          type: string
          maxLength: 255
          nullable: true
        status_evento:
          type: string
          enum: [ativo, cancelado]

    EventoDetalhe:
      allOf:
        - $ref: '#/components/schemas/Evento'
        - type: object
          properties:
            artistas:
              type: array
              description: Artistas e atrações relacionados ao evento.
              items:
                $ref: '#/components/schemas/ArtistaEvento'

    ArtistaEvento:
      type: object
      properties:
        id_artista:
          type: integer
        nome_artista:
          type: string
        genero_artista:
          type: string
          nullable: true
        imagem_artista:
          type: string
          nullable: true

    ModeracaoSolicitacao:
      type: object
      required: [acao]
      properties:
        acao:
          type: string
          enum: [aprovar, recusar, moderar]
        status_solicitacao:
          type: string
          enum: [aprovado, recusado]
          description: Obrigatório somente quando acao for moderar.

    EdicaoSolicitacao:
      type: object
      required: [acao]
      properties:
        acao:
          type: string
          enum: [editar_solicitacao]
        nome_evento:
          type: string
          maxLength: 100
        horario_evento:
          type: string
          nullable: true
          example: '20:00'
        data_evento:
          type: string
          format: date
          nullable: true
        cep_evento:
          type: string
          pattern: '^\d{8}$'
        endereco_evento:
          type: string
          maxLength: 255
        numero_endereco:
          type: string
          maxLength: 20
          nullable: true
        rua_evento:
          type: string
          maxLength: 100
          nullable: true
        cidade_evento:
          type: string
          maxLength: 100
          nullable: true
        uf:
          type: string
          minLength: 2
          maxLength: 2
          nullable: true
        categoria_evento:
          type: string
          maxLength: 255
          nullable: true
        link_oficial:
          type: string
          format: uri
          maxLength: 255
          nullable: true
        gratuidade:
          type: boolean
        valor_ingresso_minimo:
          type: number
          format: double
          nullable: true
        valor_ingresso_maximo:
          type: number
          format: double
          nullable: true
        descricao_evento:
          type: string
          maxLength: 1000
          nullable: true
        descricao_artista:
          type: string
          maxLength: 1000
          nullable: true
        nome_artista_solicitado:
          type: string
          maxLength: 150
          nullable: true

    EventoAtualizacao:
      type: object
      required: [acao]
      properties:
        acao:
          type: string
          enum: [editar]
        nome_evento:
          type: string
          maxLength: 100
        cep_evento:
          type: string
          pattern: '^\d{8}$'
        endereco_evento:
          type: string
          maxLength: 255
        numero_endereco:
          type: string
          maxLength: 20
          nullable: true
        rua_evento:
          type: string
          maxLength: 100
          nullable: true
        cidade_evento:
          type: string
          maxLength: 100
          nullable: true
        uf:
          type: string
          minLength: 2
          maxLength: 2
          nullable: true
        descricao_evento:
          type: string
          maxLength: 1000
          nullable: true
        data_evento:
          type: string
          format: date
          nullable: true
        horario_evento:
          type: string
          format: time
          nullable: true
        gratuidade:
          type: boolean
        valor_ingresso_minimo:
          type: number
          format: double
          nullable: true
        valor_ingresso_maximo:
          type: number
          format: double
          nullable: true
        categoria_evento:
          type: string
          maxLength: 255
          nullable: true
        link_oficial:
          type: string
          format: uri
          maxLength: 255
          nullable: true
        imagem_evento:
          type: string
          maxLength: 255
          nullable: true
        status_evento:
          type: string
          enum: [ativo, cancelado]

    SolicitacaoCadastro:
      type: object
      required:
        - nome_evento
        - foto
        - horario_evento
        - data_evento
        - cep_evento
        - endereco_evento
        - cidade_evento
        - uf
        - categoria_evento
        - link_oficial
        - gratuidade
        - descricao_evento
        - descricao_artista
        - nome_artista_solicitado
      properties:
        nome_evento:
          type: string
          maxLength: 100
        foto:
          type: string
          format: binary
        horario_evento:
          type: string
          example: '20:00'
        data_evento:
          type: string
          format: date
          nullable: true
        cep_evento:
          type: string
          pattern: '^\d{8}$'
        endereco_evento:
          type: string
          maxLength: 255
        numero_endereco:
          type: string
          maxLength: 20
          nullable: true
        rua_evento:
          type: string
          maxLength: 100
          nullable: true
        cidade_evento:
          type: string
          maxLength: 100
          nullable: true
        uf:
          type: string
          minLength: 2
          maxLength: 2
          nullable: true
        categoria_evento:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [Música, Cinema, Show Nacional, Show Internacional, Workshop, Oficina, Gastronômico, Literatura]
        link_oficial:
          type: string
          format: uri
          maxLength: 255
          nullable: true
        gratuidade:
          type: boolean
          description: Quando false, valor_ingresso_minimo é obrigatório.
        valor_ingresso_minimo:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          nullable: true
        valor_ingresso_maximo:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          nullable: true
          description: Quando informado, deve ser maior ou igual ao valor mínimo.
        descricao_evento:
          type: string
          maxLength: 1000
          nullable: true
        descricao_artista:
          type: string
          maxLength: 1000
          nullable: true
        nome_artista_solicitado:
          type: string
          maxLength: 150
          nullable: true

    SolicitacaoResultado:
      type: object
      properties:
        id_solicitacao:
          type: integer
        status_solicitacao:
          type: string
          enum: [pendente, aprovado, recusado]
        id_evento:
          type: integer
          nullable: true
        foto:
          type: string
          nullable: true

    SolicitacaoAdmin:
      type: object
      properties:
        id_solicitacao:
          type: integer
        id_user:
          type: integer
        nome_evento:
          type: string
        status_solicitacao:
          type: string
          enum: [pendente, aprovado, recusado]
        foto:
          type: string
          nullable: true
        horario_evento:
          type: string
          nullable: true
        data_evento:
          type: string
          format: date
        cep_evento:
          type: string
          pattern: '^\d{8}$'
          nullable: true
        endereco_evento:
          type: string
          maxLength: 255
          nullable: true
        numero_endereco:
          type: string
          maxLength: 20
          nullable: true
        rua_evento:
          type: string
          maxLength: 100
          nullable: true
        cidade_evento:
          type: string
          maxLength: 100
        uf:
          type: string
          minLength: 2
          maxLength: 2
        categoria_evento:
          type: string
          maxLength: 255
          nullable: true
        link_oficial:
          type: string
          format: uri
          maxLength: 255
        gratuidade:
          type: boolean
          description: Quando false, valor_ingresso_minimo é obrigatório.
        valor_ingresso_minimo:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          nullable: true
        valor_ingresso_maximo:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          nullable: true
          description: Quando informado, deve ser maior ou igual ao valor mínimo.
        descricao_evento:
          type: string
          maxLength: 1000
        descricao_artista:
          type: string
          maxLength: 1000
        nome_artista_solicitado:
          type: string
          maxLength: 150
        data_solicitacao:
          type: string
          format: date-time
          example: '2026-09-10T14:30:00-03:00'
        nome_user:
          type: string
        sobrenome:
          type: string
          nullable: true
        email_user:
          type: string
          format: email
        id_evento:
          type: integer
          nullable: true

    PlanejamentoCadastro:
      type: object
      required: [id_evento, meio_transporte, distancia_km, tempo_estimado]
      properties:
        id_evento:
          type: integer
          minimum: 1
        meio_transporte:
          type: string
          maxLength: 30
        distancia_km:
          type: number
          format: float
          exclusiveMinimum: true
          minimum: 0
        tempo_estimado:
          type: integer
          minimum: 1
          description: Tempo em minutos.
        origem:
          type: string
          maxLength: 255
          nullable: true
        orcamento_total:
          type: number
          minimum: 0
        custo_ingresso:
          type: number
          minimum: 0
        custo_transporte:

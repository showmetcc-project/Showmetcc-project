        descricao_evento:
          type: string
          maxLength: 1000
          nullable: true
        data_evento:
          type: string
          format: date
          nullable: true
        horario_evento:
          type: string
          format: time
          nullable: true
        gratuidade:
          type: boolean
        categoria_evento:
          type: string
          maxLength: 100
          nullable: true
        link_oficial:
          type: string
          format: uri
          maxLength: 255
          nullable: true
        imagem_evento:
          type: string
          maxLength: 255
          nullable: true
        status_evento:
          type: string
          enum: [ativo, cancelado]

    SolicitacaoCadastro:

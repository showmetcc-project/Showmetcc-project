        data_evento:
          type: string
          format: date
          nullable: true
        local_evento:
          type: string
          maxLength: 100
          nullable: true
        rua_evento:
          type: string
          maxLength: 100
          nullable: true
        cidade_evento:
          type: string
          maxLength: 100
          nullable: true
        uf:

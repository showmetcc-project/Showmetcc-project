          type: string
          format: date
          nullable: true
        local_evento:
          type: string
          maxLength: 100
          nullable: true
        rua_evento:
          type: string
          maxLength: 100
          nullable: true
        cidade_evento:
          type: string
          maxLength: 100
          nullable: true
        uf:
          type: string
          minLength: 2
          maxLength: 2
          nullable: true
        categoria_evento:
          type: string
          maxLength: 100
          nullable: true
        link_oficial:
          type: string
          format: uri
          maxLength: 255
          nullable: true
        gratuidade:
          type: boolean
        descricao_evento:
          type: string
          maxLength: 1000
          nullable: true
        descricao_artista:
          type: string
          maxLength: 1000
          nullable: true
        nome_artista_solicitado:

openapi: 3.0.3
info:
  title: API REST ShowMe
  version: 1.0.0
  description: >-
    API em PHP puro para usuários, sessões, eventos, favoritos, planejamentos e avaliações.
    Campos DATE usam YYYY-MM-DD; campos DATETIME usam ISO 8601/RFC 3339 com o fuso
    America/Sao_Paulo, por exemplo 2026-09-21T14:30:00-03:00.

servers:
  - url: ./
    description: API na mesma origem do front-end

tags:
  - name: Sessões
  - name: Usuários
  - name: Eventos
  - name: Favoritos
  - name: Planejamentos
  - name: Avaliações

paths:
  /sessoes:
    get:
      tags: [Sessões]
      summary: Retorna o usuário da sessão atual
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Sessão ativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    post:
      tags: [Sessões]
      summary: Cria uma sessão com senha ou ID token do Google
      description: >-
        No login Google, procura primeiro pelo sub em google_id; se não encontrar,
        vincula uma conta do mesmo e-mail ou cria um usuário comum sem senha.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginEntrada'
      responses:
        '201':
          description: Login realizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '409':
          description: E-mail já vinculado a outra identidade Google
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '503':
          description: Login Google ainda não configurado ou dependências ausentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      tags: [Sessões]
      summary: Encerra a sessão atual
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Logout realizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /usuarios:
    post:
      tags: [Usuários]
      summary: Cadastra um usuário comum
      description: Qualquer tipo_usuario enviado pelo cliente é ignorado; o valor persistido é sempre comum.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCadastro'
      responses:
        '201':
          description: Usuário cadastrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '409':
          description: E-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /usuarios/{id}:
    get:
      tags: [Usuários]
      summary: Consulta um perfil
      description: Permitido para o próprio usuário ou para um administrador.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      responses:
        '200':
          description: Perfil encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    post:
      tags: [Usuários]
      summary: Personaliza a foto e o banner do próprio perfil
      description: >-
        Recebe upload recortado ou o caminho de uma fotografia pronta da lista branca.
        Para cada tipo, envie o arquivo ou o campo *_pronta, nunca os dois. O servidor
        valida o MIME real e redimensiona uploads para 500x500 ou 1600x400.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [acao]
              properties:
                acao:
                  type: string
                  enum: [personalizar_midia]
                foto_perfil:
                  type: string
                  format: binary
                  description: JPG, PNG ou WebP; saída final em 500x500.
                foto_banner:
                  type: string
                  format: binary
                  description: JPG, PNG ou WebP; saída final em 1600x400.
                foto_perfil_pronta:
                  type: string
                  description: Caminho de uma fotografia de perfil presente no catálogo oficial.
                foto_banner_pronta:
                  type: string
                  description: Caminho de uma fotografia de banner presente no catálogo oficial.
      responses:
        '200':
          description: Personalização atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    put:
      tags: [Usuários]
      summary: Atualiza o próprio perfil
      description: Permite alterar nome, sobrenome, e-mail e senha. tipo_usuario nunca é editável pela API.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioAtualizacao'
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: E-mail já utilizado por outro usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      tags: [Usuários]
      summary: Apaga a própria conta
      description: A exclusão em cascata do banco remove favoritos, avaliações, preferências, rotas, dados do Spotify e solicitações do usuário.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      responses:
        '200':
          description: Conta removida e sessão encerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /eventos:
    get:
      tags: [Eventos]
      summary: Lista eventos públicos ou solicitações para moderação
      description: Sem parâmetros, lista somente eventos ativos. Com busca, filtra eventos ativos por nome, cidade, categoria ou artista. Com solicitacoes, consulta a tabela de solicitações e exige uma sessão de administrador; esse parâmetro não pode ser combinado com busca, limite ou incluir_cancelados.
      parameters:
        - name: busca
          in: query
          required: false
          description: Termo pesquisado no nome do evento, cidade, categoria ou artista.
          schema:
            type: string
          example: Festival
        - name: limite
          in: query
          required: false
          description: Quantidade máxima de resultados quando busca estiver preenchido. Usado pelo autocomplete.
          schema:
            type: integer
            minimum: 1
            maximum: 50
          example: 5
        - name: solicitacoes
          in: query
          required: false
          description: Lista solicitações do status escolhido. Esta modalidade é restrita a administradores.
          schema:
            type: string
            enum: [pendente, aprovado, recusado, todas]
          example: pendente
        - name: incluir_cancelados
          in: query
          required: false
          description: Use 1 para incluir eventos cancelados. Restrito a administradores.
          schema:
            type: integer
            enum: [0, 1]
            default: 0
      responses:
        '200':
          description: Lista de eventos públicos ou de solicitações administrativas
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      eventos:
                        type: array
                        items:
                          $ref: '#/components/schemas/Evento'
                  - type: object
                    properties:
                      solicitacoes:
                        type: array
                        items:
                          $ref: '#/components/schemas/SolicitacaoAdmin'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
    post:
      tags: [Eventos]
      summary: Cria uma solicitação de evento
      description: O evento permanece pendente até a análise de um administrador. Exige exatamente uma foto JPG, PNG ou WebP, com até 10 MB; vídeos não são aceitos. Os dados textuais da solicitação pendente podem ser corrigidos por um administrador com PUT e acao=editar_solicitacao; a foto original é preservada.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SolicitacaoCadastro'
      responses:
        '201':
          description: Solicitação criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  solicitacao:
                    $ref: '#/components/schemas/SolicitacaoResultado'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /eventos/{id}:
    get:
      tags: [Eventos]
      summary: Consulta um evento aprovado
      description: Por padrão, eventos cancelados retornam 404. Um administrador pode consultá-los com incluir_cancelados=1.
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
        - name: incluir_cancelados
          in: query
          required: false
          description: Use 1 para permitir o retorno de um evento cancelado. Restrito a administradores.
          schema:
            type: integer
            enum: [0, 1]
            default: 0
      responses:
        '200':
          description: Evento encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  evento:
                    $ref: '#/components/schemas/EventoDetalhe'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
    put:
      tags: [Eventos]
      summary: Edita/modera uma solicitação ou edita um evento publicado
      description: >-
        Use acao=editar_solicitacao para corrigir uma solicitação ainda pendente,
        acao=aprovar ou acao=recusar para decidir diretamente, acao=moderar com
        status_solicitacao para manter compatibilidade, e acao=editar quando o ID
        representar um evento já publicado. Ao aprovar, todos os campos são
        promovidos para evento, id_solicitacao_origem é preenchido e o artista é
        criado ou reutilizado por nome normalizado. A edição preserva a foto enviada.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ModeracaoSolicitacao'
                - $ref: '#/components/schemas/EdicaoSolicitacao'
                - $ref: '#/components/schemas/EventoAtualizacao'
      responses:
        '200':
          description: Solicitação analisada ou evento atualizado
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      mensagem:
                        type: string
                      solicitacao:
                        $ref: '#/components/schemas/SolicitacaoResultado'
                  - type: object
                    properties:
                      mensagem:
                        type: string
                      solicitacao:
                        $ref: '#/components/schemas/SolicitacaoAdmin'
                  - type: object
                    properties:
                      mensagem:
                        type: string
                      evento:
                        $ref: '#/components/schemas/Evento'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Solicitação já analisada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    delete:
      tags: [Eventos]
      summary: Remove um evento
      description: Restrito a administradores. Relacionamentos configurados com ON DELETE CASCADE são removidos pelo banco.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      responses:
        '200':
          description: Evento removido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /planejamento:
    get:
      tags: [Planejamentos]
      summary: Lista os planejamentos finalizados do usuário atual
      description: Cada planejamento já inclui os dados principais do evento relacionado.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Lista de planejamentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  planejamentos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Planejamento'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    post:
      tags: [Planejamentos]
      summary: Finaliza o planejamento de um evento
      description: Um usuário pode manter somente um planejamento por evento.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanejamentoCadastro'
      responses:
        '201':
          description: Planejamento criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  planejamento:
                    $ref: '#/components/schemas/PlanejamentoRota'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: O usuário já finalizou um planejamento para o evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /planejamento/{id}:
    put:
      tags: [Planejamentos]
      summary: Edita um planejamento do usuário atual
      description: O parâmetro id representa id_rota. id_user e id_evento não são editáveis.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanejamentoAtualizacao'
      responses:
        '200':
          description: Planejamento atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  planejamento:
                    $ref: '#/components/schemas/PlanejamentoRota'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    delete:
      tags: [Planejamentos]
      summary: Desfaz um planejamento do usuário atual
      description: O parâmetro id representa id_rota.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      responses:
        '200':
          description: Planejamento removido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /favoritos:
    get:
      tags: [Favoritos]
      summary: Lista os favoritos do usuário atual
      description: Cada item contém id_favorito e id_evento, permitindo ao frontend alternar o favorito sem endpoint adicional.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Lista de favoritos
          content:
            application/json:
              schema:
                type: object
                properties:
                  favoritos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Favorito'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    post:
      tags: [Favoritos]
      summary: Adiciona um evento aos favoritos
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_evento]
              properties:
                id_evento:
                  type: integer
      responses:
        '201':
          description: Favorito criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  favorito:
                    $ref: '#/components/schemas/FavoritoCriado'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Evento já favoritado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /favoritos/{id}:
    delete:
      tags: [Favoritos]
      summary: Remove um favorito
      description: O parâmetro id representa id_favorito e o registro deve pertencer ao usuário atual.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      responses:
        '200':
          description: Favorito removido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /avaliacoes:
    get:
      tags: [Avaliações]
      summary: Lista avaliações de um evento
      parameters:
        - name: evento_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Lista de avaliações
          content:
            application/json:
              schema:
                type: object
                properties:
                  avaliacoes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Avaliacao'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
    post:
      tags: [Avaliações]
      summary: Cria uma avaliação
      description: Exige de 1 a 5 mídias no total. Cada arquivo pode ser uma foto JPG, PNG ou WebP (até 10 MB) ou um vídeo MP4 ou WebM (até 30 MB). A requisição completa não pode ultrapassar 38 MB.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvaliacaoEntrada'
      responses:
        '201':
          description: Avaliação criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  avaliacao:
                    $ref: '#/components/schemas/Avaliacao'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Usuário já avaliou o evento
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                  id_avaliacao:
                    type: integer
                    description: ID da avaliação existente, quando identificado antes da inserção.

  /avaliacoes/{id}:
    get:
      tags: [Avaliações]
      summary: Busca uma avaliação pelo ID
      description: Retorna os dados da avaliação, o nome do evento e todas as mídias associadas.
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      responses:
        '200':
          description: Avaliação encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  avaliacao:
                    $ref: '#/components/schemas/Avaliacao'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    put:
      tags: [Avaliações]
      summary: Atualiza uma avaliação
      description: Permitido para o autor da avaliação ou para um administrador. Este endpoint edita somente nota e comentário e preserva as mídias definidas na criação.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvaliacaoAtualizacao'
      responses:
        '200':
          description: Avaliação atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  avaliacao:
                    $ref: '#/components/schemas/Avaliacao'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
    delete:
      tags: [Avaliações]
      summary: Remove uma avaliação
      description: Permitido para o autor da avaliação ou para um administrador.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdNaRota'
      responses:
        '200':
          description: Avaliação removida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: PHPSESSID

  parameters:
    IdNaRota:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    RequisicaoInvalida:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoAutenticado:
      description: Sessão inexistente ou credenciais inválidas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Proibido:
      description: Usuário sem permissão
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoEncontrado:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

  schemas:
    Erro:
      type: object
      required: [erro]
      properties:
        erro:
          type: string

    Mensagem:
      type: object
      required: [mensagem]
      properties:
        mensagem:
          type: string

    LoginEntrada:
      description: Use exatamente uma das duas formas de autenticação.
      oneOf:
        - $ref: '#/components/schemas/LoginSenhaEntrada'
        - $ref: '#/components/schemas/LoginGoogleEntrada'

    LoginSenhaEntrada:
      type: object
      required: [email, senha]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 100
        senha:
          type: string
          format: password

    LoginGoogleEntrada:
      type: object
      required: [google_token]
      additionalProperties: false
      properties:
        google_token:
          type: string
          description: ID token JWT emitido pelo Google Identity Services.

    UsuarioCadastro:
      type: object
      required: [nome, sobrenome, email, senha]
      properties:
        nome:
          type: string
          maxLength: 100
        sobrenome:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        senha:
          type: string
          format: password
          minLength: 6

    UsuarioAtualizacao:
      type: object
      description: Informe pelo menos um campo editável. Se tipo_usuario for enviado, será ignorado e nunca alterado.
      properties:
        nome:
          type: string
          maxLength: 100
        sobrenome:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        senha:
          type: string
          format: password
          minLength: 6

    Usuario:
      type: object
      properties:
        id_user:
          type: integer
        nome_user:
          type: string
        sobrenome:
          type: string
          nullable: true
        email_user:
          type: string
          format: email
        tipo_usuario:
          type: string
          enum: [comum, admin]
        foto_perfil:
          type: string
          nullable: true
          readOnly: true
          description: Caminho do upload processado ou do SVG pronto selecionado.
        foto_banner:
          type: string
          nullable: true
          readOnly: true
          description: Caminho do upload processado ou do SVG pronto selecionado.
        data_cadastro:
          type: string
          format: date-time

    Evento:
      type: object
      properties:
        id_evento:
          type: integer
        id_solicitacao_origem:
          type: integer
          nullable: true
          readOnly: true
        num_evento:
          type: integer
          nullable: true
          readOnly: true
          description: Campo legado, mantido no banco e sem uso definido pela API.
        nome_evento:
          type: string
        local_evento:
          type: string
          maxLength: 100
          nullable: true
        rua_evento:
          type: string
          maxLength: 100
          nullable: true
        cidade_evento:
          type: string
          maxLength: 100
          nullable: true
        uf:
          type: string
          nullable: true
        descricao_evento:
          type: string
          nullable: true
        data_evento:
          type: string
          format: date
          nullable: true
        horario_evento:
          type: string
          format: time
          nullable: true
        gratuidade:
          type: boolean
        categoria_evento:
          type: string
          maxLength: 100
          nullable: true
        link_oficial:
          type: string
          format: uri
          maxLength: 255
          nullable: true
        imagem_evento:
          type: string
          maxLength: 255
          nullable: true
        status_evento:
          type: string
          enum: [ativo, cancelado]

    EventoDetalhe:
      allOf:
        - $ref: '#/components/schemas/Evento'
        - type: object
          properties:
            artistas:
              type: array
              description: Artistas e atrações relacionados ao evento.
              items:
                $ref: '#/components/schemas/ArtistaEvento'

    ArtistaEvento:
      type: object
      properties:
        id_artista:
          type: integer
        nome_artista:
          type: string
        genero_artista:
          type: string
          nullable: true
        imagem_artista:
          type: string
          nullable: true

    ModeracaoSolicitacao:
      type: object
      required: [acao]
      properties:
        acao:
          type: string
          enum: [aprovar, recusar, moderar]
        status_solicitacao:
          type: string
          enum: [aprovado, recusado]
          description: Obrigatório somente quando acao for moderar.

    EdicaoSolicitacao:

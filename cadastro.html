<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro - ShowMe</title>

  <!-- Favicon -->
  <link href="assets/img/showme.png" rel="icon">

  <!-- Bootstrap -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

  <!-- Fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- CSS -->
  <link href="assets/css/main.css" rel="stylesheet">

</head>

<body>

  <main class="main-cadastro">

    <div class="cadastro-container">

      <div class="cadastro-logo">
        <img src="assets/img/showme.png" alt="ShowMe">
      </div>

      <section class="cadastro-card">

        <h1>Criar Conta</h1>

        <form>

          <div class="row">

            <div class="col-md-6 mb-3">

              <label>Nome</label>

              <div class="cadastro-input-box">
                <i class="bi bi-person"></i>

                <input
                  type="text"
                  class="form-control cadastro-input"
                  placeholder="Digite seu nome">
              </div>

            </div>

            <div class="col-md-6 mb-3">

              <label>Sobrenome</label>

              <div class="cadastro-input-box">
                <i class="bi bi-person"></i>

                <input
                  type="text"
                  class="form-control cadastro-input"
                  placeholder="Digite seu sobrenome">
              </div>

            </div>

          </div>

          <div class="mb-3">

            <label>Apelido</label>

            <div class="cadastro-input-box">
              <i class="bi bi-person-circle"></i>

              <input
                type="text"
                class="form-control cadastro-input"
                placeholder="Como deseja ser chamado?">
            </div>

          </div>

          <div class="mb-3">

            <label>E-mail</label>

            <div class="cadastro-input-box">
              <i class="bi bi-envelope"></i>

              <input
                type="email"
                class="form-control cadastro-input"
                placeholder="seuemail@gmail.com">
            </div>

          </div>

          <div class="mb-4">

            <label>Senha</label>

            <div class="cadastro-input-box">
              <i class="bi bi-lock"></i>

              <input
                type="password"
                class="form-control cadastro-input"
                placeholder="Mínimo 6 caracteres">
            </div>

          </div>

          <button type="submit" class="cadastro-btn">
            Criar Conta
          </button>

        </form>

        <p class="cadastro-link">

          Já possui conta?

          <a href="login.html">
            Entrar
          </a>

        </p>

      </section>

    </div>

  </main>


    <footer id="footer" class="footer">

    <div class="footer-line"></div>

    <div class="container footer-top">

      <div class="row gy-4">


        <div class="col-lg-4 col-md-6 footer-about">

          <h4 class="logo-footer">
            <span class="verde">Show</span><span class="rosa">Me</span>
          </h4>

          <p>Democratizando o acesso à cultura desde 2026</p>
          <p> 
          <a href="index.html">Voltar</a> 
          para o início
          </p>

          <div class="social-links">
            <a href="https://www.instagram.com/showmetcc/"><i class="bi bi-instagram"></i></a>
            <a href="#"><i class="bi bi-twitter-x"></i></a>
            <a href="#"><i class="bi bi-facebook"></i></a>
          </div>

        </div>


        <div class="col-lg-4 col-md-6">

          <h4>Entre em Contato</h4>

          <form class="footer-contact-form">

            <input type="email" placeholder="Seu e-mail">

            <textarea placeholder="Sua mensagem"></textarea>

            <button type="submit">
              <i class="bi bi-envelope"></i>
              Enviar
            </button>

          </form>

        </div>

        <div class="col-lg-4 col-md-12 footer-links">

          <h4>Informações</h4>

          <ul>
            <li><a href="#">Termos de Uso</a></li>
            <li><a href="#">Política de Privacidade</a></li>
          </ul>

          <p class="copyright-text">
            © 2026 ShowMe. Todos os direitos reservados.
          </p>

        </div>

      </div>

    </div>

  </footer>


</body>

</html>

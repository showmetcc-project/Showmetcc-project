<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShowMe - Cadastro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/cadastro.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid cadastro-container">

    <div class="logo">
        <span class="show">Show</span><span class="me">Me</span>
    </div>

    <div class="cadastro-card">

        <h2>Cadastro</h2>

        <form>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Nome</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa-solid fa-user"></i>
                        </span>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Digite seu nome">
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Sobrenome</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa-solid fa-user"></i>
                        </span>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Digite seu sobrenome">
                    </div>
                </div>

            </div>

            <div class="mb-3">
                <label class="form-label">Como gostaria de ser chamado?</label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa-solid fa-user-tag"></i>
                    </span>

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Seu apelido">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">E-mail</label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa-solid fa-envelope"></i>
                    </span>

                    <input
                        type="email"
                        class="form-control"
                        placeholder="Digite seu e-mail">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Senha</label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fa-solid fa-lock"></i>
                    </span>

                    <input
                        type="password"
                        class="form-control"
                        placeholder="Digite sua senha">
                </div>
            </div>

            <button type="submit" class="btn btn-cadastrar">
                Cadastrar
            </button>

            <div class="login-link">
                Já possui uma conta?
                <a href="#">Entrar</a>
            </div>

        </form>

    </div>

</div>

</body>
</html>

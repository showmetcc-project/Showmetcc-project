<body class="index-page">

 <main class="main-login">

    <div class="login-wrapper">

        <div class="logo">
            <img src="assets/img/showme.png">
        </div>

        <div class="login-card">

            <h2>Entrar</h2>

            <button type="button" class="social-btn google-btn">
                <i class="bi bi-google"></i>
                Continuar com Google
            </button>

            <button type="button" class="social-btn spotify-btn">
                <i class="bi bi-spotify"></i>
                Continuar com Spotify
            </button>

            <div class="divider">
                <span>ou</span>
            </div>

            <form>

                <div class="mb-3">
                    <label>E-mail</label>

                    <div class="input-group custom-input">

                        <span class="input-group-text">
                            <i class="bi bi-envelope-fill"></i>
                        </span>

                        <input
                            type="email"
                            class="form-control"
                            placeholder="seu@gmail.com">
                    </div>

                </div>

                <div class="mb-3">
                    <label>Senha</label>

                    <div class="input-group custom-input">

                        <span class="input-group-text">
                            <i class="bi bi-lock-fill"></i>
                        </span>

                        <input
                            type="password"
                            class="form-control"
                            placeholder="••••••••">
                    </div>

                </div>

                <button type="submit" class="btn-login">
                         <a href="inicio.html">Entrar</a>
                </button>

            </form>

            <div class="admin-link">
                Procurando pela
                <a href="loginAdm.html">área administrativa?</a>
            </div>

            <div class="register-link">
                <a href="cadastro.html">Não tenho Cadastro</a>
            </div>

        </div>

    </div>

</main>
  <footer id="footer" class="footer">

    <div class="footer-line"></div>

    <div class="container footer-top">

      <div class="row gy-4">


        <div class="col-lg-4 col-md-6 footer-about">

          <h4 class="logo-footer">
            <span class="verde">Show</span><span class="rosa">Me</span>
          </h4>

          <p>Democratizando o acesso à cultura desde 2026</p>
          <a href="index.html">Voltar</a>

          <div class="social-links">
            <a href="#"><i class="bi bi-instagram"></i></a>
            <a href="#"><i class="bi bi-twitter-x"></i></a>
            <a href="#"><i class="bi bi-facebook"></i></a>
          </div>

        </div>


        <div class="col-lg-4 col-md-6">

          <h4>Entre em Contato</h4>

          <form class="footer-contact-form">

            <input type="email" placeholder="Seu e-mail">

            <textarea placeholder="Sua mensagem"></textarea>

            <button type="submit">
              <i class="bi bi-envelope"></i>
              Enviar
            </button>

          </form>

        </div>

        <div class="col-lg-4 col-md-12 footer-links">

          <h4>Informações</h4>

          <ul>
            <li><a href="#">Termos de Uso</a></li>
            <li><a href="#">Política de Privacidade</a></li>
          </ul>

          <p class="copyright-text">
            © 2026 ShowMe. Todos os direitos reservados.
          </p>

        </div>

      </div>

    </div>

  </footer>
